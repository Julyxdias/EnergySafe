events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Redireciona HTTP → HTTPS
  server {
    listen 80;
    server_name energysafe.eco.br www.energysafe.eco.br;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name energysafe.eco.br www.energysafe.eco.br;

    ssl_certificate     /etc/letsencrypt/live/energysafe.eco.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/energysafe.eco.br/privkey.pem;

    # Frontend estático
    location / {
      root  /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /index.html;
    }

    # API FastAPI
    location /api/ {
      proxy_pass         http://backend:8000/;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
    }

    # Relatórios PDF
    location /api/relatorios/ {
      proxy_pass         http://backend:8000/relatorios/;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_read_timeout 300s;
    }

    # Swagger
    location /docs {
      proxy_pass http://backend:8000/docs;
      proxy_set_header Host $host;
    }

    location /redoc {
      proxy_pass http://backend:8000/redoc;
      proxy_set_header Host $host;
    }

    location /openapi.json {
      proxy_pass http://backend:8000/openapi.json;
      proxy_set_header Host $host;
    }
  }
}
